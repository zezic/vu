[package]
name = "vu"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-only"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.86"
bytemuck = { version = "1.25", features = ["derive"] }
cpal = "0.18.2"
cpu-time = "1.0"
directories = "5.0"
log = "0.4.22"
pretty_env_logger = "0.5.0"
pollster = "0.4.0"
parley = { version = "0.9.0", default-features = false, features = ["std"] }
ron = "0.8.1"
serde = { version = "1.0", features = ["derive"] }
strum = { version = "0.26.3", features = ["derive"] }
vello = "0.11.0"
winit = "0.30.5"

[dev-dependencies]
png = "0.18.1"
tempfile = "3.20.0"

[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.18.2", features = ["pulseaudio"] }

[target.'cfg(target_os = "macos")'.dependencies]
coreaudio = { version = "0.5.0", features = ["process-tap"] }
objc2 = { version = "0.6.5", default-features = false, features = ["std"] }
objc2-core-audio = { version = "0.3.2", default-features = false, features = ["std", "AudioHardware", "objc2", "objc2-foundation"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSString", "NSUUID"] }
