[package]
name = "vu"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.86"
biquad = "0.4.2"
cpal = "0.18.2"
femtovg = "0.9.2"
glutin = "0.32.0"
glutin-winit = "0.5.0"
instant = { version = "0.1.13", features = ["now"] }
log = "0.4.22"
pretty_env_logger = "0.5.0"
raw-window-handle = "0.6.2"
resource = "0.5.0"
usvg = "0.43.0"
winit = "0.30.5"

[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.18.2", features = ["pulseaudio"] }

[target.'cfg(target_os = "macos")'.dependencies]
coreaudio = { version = "0.5.0", features = ["process-tap"] }
objc2 = { version = "0.6.5", default-features = false, features = ["std"] }
objc2-core-audio = { version = "0.3.2", default-features = false, features = ["std", "AudioHardware", "objc2", "objc2-foundation"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSString", "NSUUID"] }
